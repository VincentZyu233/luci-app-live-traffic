name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and trigger detection
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flags.outputs.should_build }}
      should_release: ${{ steps.flags.outputs.should_release }}
      version: ${{ steps.flags.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Parse commit message
        id: flags
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          package_version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          package_release="$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          test -n "$package_version"
          test -n "$package_release"
          should_build=false
          should_release=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            should_build=true
          elif printf '%s\n' "$COMMIT_MSG" | grep -Fqi '[build-release]'; then
            should_build=true
            should_release=true
          elif printf '%s\n' "$COMMIT_MSG" | grep -Fqi '[build-action]'; then
            should_build=true
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=v${package_version}-r${package_release}" >> "$GITHUB_OUTPUT"
          echo "build=$should_build release=$should_release version=v${package_version}-r${package_release}"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: find htdocs -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate JSON
        run: find root -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Run tests
        run: node --test tests/core.test.mjs
      - name: Check Python
        run: python -m py_compile scripts/deploy.py

  build:
    name: Build OpenWrt IPK
    runs-on: ubuntu-latest
    needs: checks
    if: needs.checks.outputs.should_build == 'true'
    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.4/targets/ramips/mt7621/openwrt-sdk-23.05.4-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk gettext libssl-dev xsltproc rsync unzip python3
      - name: Download OpenWrt SDK
        run: |
          curl -fsSL "$SDK_URL" -o /tmp/openwrt-sdk.tar.xz
          mkdir /tmp/openwrt-sdk
          tar -xJf /tmp/openwrt-sdk.tar.xz -C /tmp/openwrt-sdk --strip-components=1
      - name: Prepare feeds
        working-directory: /tmp/openwrt-sdk
        run: |
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base nlbwmon rpcd-mod-ucode
          ln -s "$GITHUB_WORKSPACE" package/luci-app-live-traffic
          make defconfig
      - name: Build IPK
        working-directory: /tmp/openwrt-sdk
        run: make package/luci-app-live-traffic/compile V=sc
      - name: Collect package
        run: |
          mkdir -p dist
          find /tmp/openwrt-sdk/bin -name 'luci-app-live-traffic_*.ipk' -exec cp {} dist/ \;
          find /tmp/openwrt-sdk/bin -name 'luci-i18n-live-traffic-zh-cn_*.ipk' -exec cp {} dist/ \;
          test -n "$(find dist -name '*.ipk' -print -quit)"
          find dist -name 'luci-app-live-traffic_*.ipk' -print -quit | grep -q .
          find dist -name 'luci-i18n-live-traffic-zh-cn_*.ipk' -print -quit | grep -q .
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-live-traffic-${{ needs.checks.outputs.version }}-openwrt-23.05
          path: dist/*.ipk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ checks, build ]
    if: needs.checks.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: luci-app-live-traffic-${{ needs.checks.outputs.version }}-openwrt-23.05
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump PKG_VERSION or PKG_RELEASE." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.ipk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "luci-app-live-traffic $RELEASE_TAG" \
            --generate-notes
